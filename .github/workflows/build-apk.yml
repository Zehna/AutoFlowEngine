name: Build & Release AutoFlow Engine APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Verify assembleDebug & Publish Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.11 (for Chaquopy build tool)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/release.keystore" \
            -storetype PKCS12 \
            -alias autoflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass autoflow_release_pass \
            -keypass autoflow_release_pass \
            -dname "CN=AutoFlow Engine, OU=Mobile, O=Zehna, L=Jakarta, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify assembleDebug Builds
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Standard & Full Release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: autoflow_release_pass
          RELEASE_KEY_ALIAS: autoflow
          RELEASE_KEY_PASSWORD: autoflow_release_pass
        run: ./gradlew assembleStandardRelease assembleFullRelease --stacktrace

      - name: Prepare & Inspect Release APKs
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/standard/release/app-standard-release.apk release_apks/AutoFlowEngine-Standard-v2.0.0.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk release_apks/AutoFlowEngine-FullA11y-v2.0.0.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          echo "=== Permissions in Standard APK ==="
          "$AAPT2" dump permissions release_apks/AutoFlowEngine-Standard-v2.0.0.apk
          echo "=== Providers & Manifest check in Standard APK ==="
          "$AAPT2" dump xmltree release_apks/AutoFlowEngine-Standard-v2.0.0.apk --file AndroidManifest.xml | grep -iE "fileprovider|ShizukuProvider|SYSTEM_ALERT_WINDOW|accessibility|BIND_NOTIFICATION_LISTENER|debuggable"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoFlowEngine-v2.0.0-APKs
          path: release_apks/*.apk

      - name: Publish GitHub Release v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0.0 --yes || true
          git tag -f v2.0.0
          git push -f origin v2.0.0 || true
          gh release create v2.0.0 \
            release_apks/AutoFlowEngine-Standard-v2.0.0.apk \
            release_apks/AutoFlowEngine-FullA11y-v2.0.0.apk \
            --title "AutoFlow Engine v2.0.0 (Modular Workflow Automation Engine)" \
            --notes "### AutoFlow Engine v2.0.0

          Upgrade penuh menjadi **Modular Workflow Automation Engine**:
          - **Modular JSON Schema & Orchestrator StateFlow**: Mendukung \`executionPolicy\` (\`ONCE\`/\`LOOP\`), linked \`nodes\` (\`next\`/\`END\`), kondisi percabangan, retry policy, dan resolusi path \`{{variables.key}}\` + \`{{node_id.output.field}}\`.
          - **Pluggable Worker Registry**: \`SHIZUKU_SHELL\` (\`EXEC\`, \`LAUNCH_COMPONENT\`, \`FORCE_STOP\`, \`PUT_SETTING\`, \`TAP\`), \`WEBVIEW_HEADLESS\` (SPA selector polling + shared CookieManager), \`NETWORK_HTTP\`, \`COMPUTE_KOTLIN\` (Room KV \`DEDUPLICATE\` dengan TTL), \`GEMINI_AI\`, \`PYTHON_COMPUTE\` (\`RUN_INLINE\` & \`CALL_MODULE\`), dan \`DELAY\`.
          - **Foreground Service & Floating STOP Bubble**: Notifikasi persisten dengan tombol kontrol **Pause**, **Resume**, **Stop**, serta \`FloatingControlOverlay\`.
          - **Dashboard UI & Navigation Drawer (\`≡\`)**: Active Execution Telemetry Card, daftar Workflow Terpasang (\`filesDir/workflows/\`), import \`.json\`/\`.zip\` (Zip-Slip protection), type-aware Variable Configurator sheet, Live Execution Console auto-scroll, Session WebView Login, Dual-mode Workflow Editor, dan Output Vault CSV export.

          #### Varian APK:
          1. **AutoFlowEngine-Standard-v2.0.0.apk** *(Direkomendasikan — bebas izin sensitif pemicu blokir Play Protect)*
          2. **AutoFlowEngine-FullA11y-v2.0.0.apk** *(Varian lengkap dengan AccessibilityService & NotificationListener)*"
