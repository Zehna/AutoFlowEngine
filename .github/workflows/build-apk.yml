name: Build & Release AutoFlow Engine APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Verify assembleDebug & Publish Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.11 (for Chaquopy build tool)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/release.keystore" \
            -storetype PKCS12 \
            -alias autoflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass autoflow_release_pass \
            -keypass autoflow_release_pass \
            -dname "CN=AutoFlow Engine, OU=Mobile, O=Zehna, L=Jakarta, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify assembleDebug Builds
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Standard & Full Release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: autoflow_release_pass
          RELEASE_KEY_ALIAS: autoflow
          RELEASE_KEY_PASSWORD: autoflow_release_pass
        run: ./gradlew assembleStandardRelease assembleFullRelease --stacktrace

      - name: Prepare & Inspect Release APKs
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/standard/release/app-standard-release.apk release_apks/AutoFlowEngine-Standard-v2.1.1.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk release_apks/AutoFlowEngine-FullA11y-v2.1.1.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          echo "=== Permissions in Standard APK ==="
          "$AAPT2" dump permissions release_apks/AutoFlowEngine-Standard-v2.1.1.apk
          echo "=== Providers & Manifest check in Standard APK ==="
          "$AAPT2" dump xmltree release_apks/AutoFlowEngine-Standard-v2.1.1.apk --file AndroidManifest.xml | grep -iE "fileprovider|ShizukuProvider|SYSTEM_ALERT_WINDOW|accessibility|BIND_NOTIFICATION_LISTENER|debuggable"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoFlowEngine-v2.1.1-APKs
          path: release_apks/*.apk

      - name: Publish GitHub Release v2.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.1.1 --yes || true
          git tag -f v2.1.1
          git push -f origin v2.1.1 || true
          gh release create v2.1.1 \
            release_apks/AutoFlowEngine-Standard-v2.1.1.apk \
            release_apks/AutoFlowEngine-FullA11y-v2.1.1.apk \
            --title "AutoFlow Engine v2.1.1 (n8n Bridge Diagnostics & Reliability Fix)" \
            --notes "### AutoFlow Engine v2.1.1

          Perbaikan koneksi & diagnostik **n8n Localhost Bridge**:
          - Memperpanjang timeout probe OkHttp (\`2s → 6s\` connect, \`5s → 12s\` read) agar koneksi ke proot/Omalauncher tetap stabil saat cold-wake.
          - Menambahkan auto-fallback alias loopback (\`127.0.0.1\` / \`localhost\` / \`[::1]\`) untuk bridge (\`:15678\`) & n8n (\`:5678\`).
          - Menambahkan \`SnackbarHost\` pada layar **n8n Localhost**, menampilkan detail error bridge secara eksplisit, dan tombol **Uji Koneksi Localhost**.
          - Menambahkan \`ACCESS_LOCAL_NETWORK\` untuk kompatibilitas Android 17+."
