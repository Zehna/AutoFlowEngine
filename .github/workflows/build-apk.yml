name: Build & Release AutoFlow Engine APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Release APKs & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.11 (for Chaquopy build tool)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/release.keystore" \
            -storetype PKCS12 \
            -alias autoflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass autoflow_release_pass \
            -keypass autoflow_release_pass \
            -dname "CN=AutoFlow Engine, OU=Mobile, O=Zehna, L=Jakarta, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standard & Full Release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: autoflow_release_pass
          RELEASE_KEY_ALIAS: autoflow
          RELEASE_KEY_PASSWORD: autoflow_release_pass
        run: ./gradlew assembleStandardRelease assembleFullRelease --stacktrace

      - name: Prepare & Inspect Release APKs
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/standard/release/app-standard-release.apk release_apks/AutoFlowEngine-Standard-v1.1.0.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk release_apks/AutoFlowEngine-FullA11y-v1.1.0.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          echo "=== Permissions in Standard APK ==="
          "$AAPT2" dump permissions release_apks/AutoFlowEngine-Standard-v1.1.0.apk
          echo "=== Manifest check in Standard APK ==="
          "$AAPT2" dump xmltree release_apks/AutoFlowEngine-Standard-v1.1.0.apk --file AndroidManifest.xml | grep -iE "accessibility|notification|alert_window|query_all|debuggable" || echo "Clean: no high-risk Play Protect flags!"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoFlowEngine-v1.1.0-APKs
          path: release_apks/*.apk

      - name: Publish GitHub Release v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.1.0 --yes || true
          git tag -f v1.1.0
          git push -f origin v1.1.0 || true
          gh release create v1.1.0 \
            release_apks/AutoFlowEngine-Standard-v1.1.0.apk \
            release_apks/AutoFlowEngine-FullA11y-v1.1.0.apk \
            --title "AutoFlow Engine v1.1.0 (Play Protect Compatible)" \
            --notes "### AutoFlow Engine v1.1.0

          Tersedia dua varian APK Release-signed:

          1. **AutoFlowEngine-Standard-v1.1.0.apk** *(Direkomendasikan)*
             - Bebas izin sensitif yang memicu blokir Google Play Protect (*AccessibilityService* & *NotificationListener* dipisahkan).
             - Dapat diinstal langsung di HP Android Indonesia.
             - Mendukung penuh CPython 3.11 (Chaquopy), Room Database Output Vault, OkHttp, Offscreen WebView, Gemini AI, Foreground Service (dengan tombol STOP di notifikasi), dan UI Automation via **Shizuku**.

          2. **AutoFlowEngine-FullA11y-v1.1.0.apk**
             - Varian lengkap dengan *AccessibilityService* (gestur Bezier & Emergency Stop Volume Down 2x), *NotificationListener*, dan *Floating Overlay*.
             - Catatan: Di Android Indonesia, instalasi sideload varian ini membutuhkan instalasi via Shizuku/ADB atau menonaktifkan sementara Play Protect."
