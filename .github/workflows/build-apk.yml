name: Build & Release AutoFlow Engine APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Release APKs & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.11 (for Chaquopy build tool)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/release.keystore" \
            -storetype PKCS12 \
            -alias autoflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass autoflow_release_pass \
            -keypass autoflow_release_pass \
            -dname "CN=AutoFlow Engine, OU=Mobile, O=Zehna, L=Jakarta, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standard & Full Release APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: autoflow_release_pass
          RELEASE_KEY_ALIAS: autoflow
          RELEASE_KEY_PASSWORD: autoflow_release_pass
        run: ./gradlew assembleStandardRelease assembleFullRelease --stacktrace

      - name: Prepare & Inspect Release APKs
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/standard/release/app-standard-release.apk release_apks/AutoFlowEngine-Standard-v2.0.0.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk release_apks/AutoFlowEngine-FullA11y-v2.0.0.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          echo "=== Permissions in Standard APK ==="
          "$AAPT2" dump permissions release_apks/AutoFlowEngine-Standard-v2.0.0.apk
          echo "=== Manifest check in Standard APK ==="
          "$AAPT2" dump xmltree release_apks/AutoFlowEngine-Standard-v2.0.0.apk --file AndroidManifest.xml | grep -iE "accessibility|notification|alert_window|query_all|debuggable" || echo "Clean: no high-risk Play Protect flags!"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoFlowEngine-v2.0.0-APKs
          path: release_apks/*.apk

      - name: Publish GitHub Release v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0.0 --yes || true
          git tag -f v2.0.0
          git push -f origin v2.0.0 || true
          gh release create v2.0.0 \
            release_apks/AutoFlowEngine-Standard-v2.0.0.apk \
            release_apks/AutoFlowEngine-FullA11y-v2.0.0.apk \
            --title "AutoFlow Engine v2.0.0 (Modular Workflow Automation Engine)" \
            --notes "### AutoFlow Engine v2.0.0

          Upgrade penuh menjadi **Modular Workflow Automation Engine**:
          - **Workflow Library & Persistence (Room v3)**: Simpan, duplikasi, impor (.json/.zip), dan ekspor bundle (.zip) dengan sanitasi secret otomatis.
          - **Visual & Raw JSON Dual-Mode Editor**: Tambah 9 tipe node modular (Python 3.11, HTTP REST, Headless WebView, UI Action, Shizuku Shell, Gemini AI, Compute/KV, Deduplicate, Delay), ubah urutan node, kondisi percabangan, retry policy, dan autocomplete variabel (\`{{node.field}}\`, \`{{vars.*}}\`, \`{{kv.*}}\`).
          - **Live Execution Console & WorkManager Scheduler**: Eksekusi terjadwal berkala di latar belakang dan pemantauan log langkah real-time.
          - **Browser Sesi Login & KV Store Secrets**: Tangkap cookie sesi WebView serta kelola API key dan deduplication state.
          - **Play Protect Safe**: Varian \`Standard\` tetap bebas dari izin sensitif pemicu blokir Google Play Protect dan mempertahankan seluruh integrasi Shizuku, Battery Optimization, dan Notifikasi.

          #### Varian APK:
          1. **AutoFlowEngine-Standard-v2.0.0.apk** *(Direkomendasikan — bebas blokir Play Protect, UI automation via Shizuku)*
          2. **AutoFlowEngine-FullA11y-v2.0.0.apk** *(Varian lengkap dengan AccessibilityService & NotificationListener)*"
